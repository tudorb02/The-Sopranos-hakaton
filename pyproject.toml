[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexxt-seed"
version = "1.0.0"
description = "Deterministic Romanian finance demo fixtures"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["seed", "seed.personas"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/seed/tests"]
