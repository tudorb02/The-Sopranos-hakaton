[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexxt-backend"
version = "1.0.0"
description = "Deterministic personal finance API and analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1", "pandas>=2.2,<3", "numpy>=2,<3",
  "scipy>=1.14,<2", "rapidfuzz>=3.10,<4", "ruptures>=1.1.9,<2", "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["seed*", "app*"]

[tool.setuptools.package-data]
app = ["analytics/preprocessing/*.json"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests", "backend/seed/tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
