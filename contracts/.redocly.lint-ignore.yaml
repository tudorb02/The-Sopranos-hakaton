# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
# Why these are ignored:
# - no-ambiguous-paths: /api/runs/demo/{scenario} is required by the plan (§7). It cannot clash with
#   /api/runs/{id}/... because run ids match ^run_[0-9a-z]{12}$, and Spring matches the literal first.
# - operation-4xx-response: GET /api/modules and GET /api/health/bedrock take no input, so there is
#   no client error to describe (health always answers 200 with the status in the body).
openapi.yaml:
  no-ambiguous-paths:
    - '#/paths/~1api~1runs~1{id}~1events'
    - '#/paths/~1api~1runs~1{id}~1submit'
    - '#/paths/~1api~1runs~1{id}~1approve'
    - '#/paths/~1api~1runs~1{id}~1request-documents'
  operation-4xx-response:
    - '#/paths/~1api~1modules/get/responses'
    - '#/paths/~1api~1health~1bedrock/get/responses'
