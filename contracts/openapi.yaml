openapi: 3.1.0
info:
  title: GreenStruct Agro API
  version: 0.1.0
  summary: The contract between the frontend (React) and the backend (Spring Boot) for GreenStruct Agro.
  description: |
    The farmer describes an investment, 3 AI agents on AWS Bedrock analyse it, and the Raiffeisen officer receives
    the green credit report.

    Rules:
    - All figures come from the deterministic engine. Agent outputs reference figures by `calcId`;
      `RunView.calcs` resolves them (value, unit, formatted text, formula, source).
    - User-visible texts are in English; keys and identifiers are in English. The `Ro` suffix of some field names
      (`labelRo`, `sourceRo`, `messageRo`, ...) is historical and kept for compatibility. Uploaded documents may be in Romanian.
    - Live events (SSE) are described in `events.md` and `schemas/event.json`.
    - Agent outputs are in `schemas/submit_*.json` (the same schemas are sent to Bedrock as tools).
    - Errors always have the shape `{ "error": { "code", "message" } }`.
  license:
    name: Proprietary (hackathon demo)
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin. Locally, Vite proxies to the backend (localhost:8080) or to Prism (localhost:4010, npm run mock).
security: []
tags:
  - name: modules
    description: The 6 investment modules (cards, documents, questions).
  - name: farms
    description: The farm profile from ANAF, APIA and Open Banking (mocked in the demo).
  - name: runs
    description: The dossiers analysed by the agents.
  - name: portfolio
    description: The bank's totals for green credits, funds and impact.
  - name: officer
    description: The credit officer's actions.
  - name: health
    description: Status of the external services before the demo.

paths:
  /api/modules:
    get:
      tags: [modules]
      operationId: listModules
      summary: List of modules
      description: The 6 cards, with the required documents and the questionnaire of each module. Only `irigatii` and `utilaje` are `DEMO_READY`.
      responses:
        '200':
          description: The modules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleList'
              examples:
                toate:
                  $ref: './examples/modules.json'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/classify:
    post:
      tags: [modules]
      operationId: classifyOffer
      summary: Investment category, from the offer
      description: The app detects the category from the uploaded offer on its own (keywords from `config/modules`, in the file name and in the PDF text). `moduleId` is null if the offer does not say what is being bought.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  format: binary
      responses:
        '200':
          description: The category found.
          content:
            application/json:
              schema:
                type: object
                required: [moduleId]
                properties:
                  moduleId:
                    type: [string, 'null']
        '500':
          $ref: '#/components/responses/InternalError'

  /api/farms/{cui}:
    get:
      tags: [farms]
      operationId: getFarm
      summary: Farm profile by CUI
      description: Company data (ANAF/ONRC), APIA parcels as GeoJSON with the risk layers, and the cashflow summary from Open Banking.
      parameters:
        - $ref: '#/components/parameters/Cui'
      responses:
        '200':
          description: The farm profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmProfile'
              examples:
                irigatii:
                  $ref: './examples/farm-irigatii.json'
                utilaje:
                  $ref: './examples/farm-utilaje.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Create a dossier and start the analysis
      description: |
        Multipart: CUI, module, parcels, questionnaire (JSON) and documents. The analysis starts asynchronously;
        progress is followed on `GET /api/runs/{id}/events`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateRunForm'
            encoding:
              parcelIds:
                contentType: application/json
              questionnaire:
                contentType: application/json
              documentManifest:
                contentType: application/json
              documents:
                contentType: application/pdf, image/jpeg, image/png
      responses:
        '202':
          $ref: '#/components/responses/RunCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/runs/demo/{scenario}:
    post:
      tags: [runs]
      operationId: createDemoRun
      summary: Load the demo dossier
      description: The "Load the demo dossier" button. Uses the fixed documents and data from `data/demo/`. The run mode (LIVE, HYBRID, REPLAY) comes from the server configuration.
      parameters:
        - name: scenario
          in: path
          required: true
          description: The demo scenario.
          schema:
            $ref: '#/components/schemas/DemoScenario'
      responses:
        '202':
          $ref: '#/components/responses/RunCreated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Full state of the dossier
      description: |
        The agent outputs and all resolved figures (`calcs`). Can be requested at any time; agent fields are `null` until that agent finishes.
        With `view=sme`, the response is what the SME sees (README §13, "the SME does not see the funds"): no `officerNotesRo` in the funding
        recommendation and only the part of the green report that concerns it (`SmeUnderwritingReport`).
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: view
          in: query
          required: false
          description: '`full` (default) = the dossier as the bank receives it; `sme` = what the SME sees.'
          schema:
            type: string
            enum: [full, sme]
            default: full
      responses:
        '200':
          description: The dossier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
              examples:
                irigatii:
                  $ref: './examples/run-irigatii.json'
                utilaje:
                  $ref: './examples/run-utilaje.json'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs/{id}/events:
    get:
      tags: [runs]
      operationId: streamRunEvents
      summary: Live event stream (SSE)
      description: |
        Server-Sent Events. Sends the history first (from `Last-Event-ID` + 1 or from `after` + 1), then the live events.
        Each event is an unnamed message (`message`) with `id: <seq>` and `data: <RunEvent JSON>`.
        The stream closes after `run.completed` or `run.failed`; the later transitions (`GATA → TRIMIS` when the application is submitted,
        `TRIMIS → APROBAT → MONITORIZARE` on approval) are received on reconnect. The full catalogue is in `events.md`.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: Last-Event-ID
          in: header
          required: false
          description: The last `seq` received (sent automatically by EventSource on reconnect).
          schema:
            type: integer
            minimum: 0
        - name: after
          in: query
          required: false
          description: Alternative to the header for the first connection (EventSource cannot set headers).
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE lines; each `data` field contains a RunEvent serialised as JSON.
                contentMediaType: application/json
                contentSchema:
                  $ref: '#/components/schemas/RunEvent'
              example: |
                id: 1
                data: {"seq":1,"runId":"run_irg7k2xq4m9p","type":"state.transition","agent":null,"at":"2026-10-28T09:30:00.000Z","message":"Dossier created: irrigation, 40 ha, 3 documents uploaded","data":{"from":null,"to":"CREAT","actor":"FARMER"}}

                id: 2
                data: {"seq":2,"runId":"run_irg7k2xq4m9p","type":"state.transition","agent":null,"at":"2026-10-28T09:30:01.200Z","message":"Company data retrieved: ANAF, APIA, Open Banking, climate risk","data":{"from":"CREAT","to":"DATE_FIRMA","actor":"SYSTEM"}}

        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs/{id}/submit:
    post:
      tags: [runs]
      operationId: submitRun
      summary: The SME submits the application to the bank
      description: |
        Only from state `GATA`. The SME picks one of the two cards (README §7, step 9); the dossier moves to `TRIMIS`
        (`state.transition`, `actor: FARMER`). `CLASIC` = the `STANDARD` option; `VERDE` = the recommended green option
        (`GREEN_PACKAGE` or `GREEN_PACKAGE_WITH_GRANT`, with `greenEligible: true`). If the dossier does not have the requested option
        (e.g. `VERDE` below the threshold, without an upgrade), the response is `409`. Responds with what the SME sees (`view=sme`).
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              variant: VERDE
      responses:
        '200':
          description: The submitted dossier, as the SME sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/runs/{id}/approve:
    post:
      tags: [officer]
      operationId: approveRun
      summary: The bank approves the dossier
      description: Final approval, only from state `TRIMIS`. Moves the dossier to `APROBAT`, then to `MONITORIZARE` (the drawdown is simulated in the demo), with one `state.transition` each.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: The updated dossier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/runs/{id}/request-documents:
    post:
      tags: [officer]
      operationId: requestDocuments
      summary: The officer requests documents
      description: Only from state `TRIMIS`. The state stays `TRIMIS`; the requested documents appear in `RunView.pendingDocuments` and on the farmer's side.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDocumentsRequest'
      responses:
        '200':
          description: The updated dossier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/runs/{id}/report.pdf:
    get:
      tags: [officer]
      operationId: getRunReport
      summary: The green report as PDF
      description: Decision, green tier, threshold, DNSH, fund, requirements, F2 category, conditions, risks (README §8). Available after `APROBAT`.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The report.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/runs/{id}/simulate-monitoring:
    post:
      tags: [officer]
      operationId: simulateMonitoring
      summary: Simulate 12 months
      description: Only from `MONITORIZARE`, for a dossier with a green credit. Loads simulated monitoring data (README §13), compares the actual impact with the estimate and applies the impact bonus if the estimate is confirmed. Once per dossier.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The updated dossier, with `monitoring` filled in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/portfolio:
    get:
      tags: [portfolio]
      operationId: getPortfolio
      summary: Green credit portfolio
      description: Totals by category, by fund and impact, from the approved dossiers (`MONITORIZARE`) with a green credit.
      responses:
        '200':
          description: The portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'

  /api/health/bedrock:
    get:
      tags: [health]
      operationId: getBedrockHealth
      summary: AWS Bedrock status
      description: The green/red indicator before the demo. Always responds 200; the status is in the body.
      responses:
        '200':
          description: Status of Bedrock and of the fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedrockHealth'
              example:
                status: UP
                region: eu-central-1
                mode: LIVE
                checkedAt: '2026-10-28T09:25:00Z'
                goldenRunsAvailable: [irigatii, utilaje]
                models:
                  - role: AGENT
                    modelId: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
                    status: UP
                    latencyMs: 820
                  - role: EXTRACTION
                    modelId: eu.anthropic.claude-haiku-4-5-20251001-v1:0
                    status: UP
                    latencyMs: 410

components:
  parameters:
    Cui:
      name: cui
      in: path
      required: true
      description: The unique registration code (CUI), with or without the RO prefix.
      schema:
        $ref: '#/components/schemas/Cui'
    RunId:
      name: id
      in: path
      required: true
      description: The dossier id.
      schema:
        $ref: '#/components/schemas/RunId'

  responses:
    RunCreated:
      description: Dossier created; the analysis runs asynchronously.
      headers:
        Location:
          description: The dossier URL.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RunCreated'
          example:
            runId: run_irg7k2xq4m9p
            state: CREAT
            runUrl: /api/runs/run_irg7k2xq4m9p
            eventsUrl: /api/runs/run_irg7k2xq4m9p/events
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: The moduleId field is missing.
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: The dossier does not exist.
    Conflict:
      description: The action is not allowed in the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_STATE
              message: The dossier can only be approved from state TRIMIS; it is now in GATA.
    PayloadTooLarge:
      description: File too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FILE_TOO_LARGE
              message: Each document can be at most 20 MB.
    Unprocessable:
      description: The request is well-formed but cannot be processed (e.g. module not configured).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: MODULE_NOT_READY
              message: The livestock module is not yet available for a full analysis.
    UpstreamError:
      description: An external service (ANAF, APIA, Open Banking) is not responding and there is no cached data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UPSTREAM_UNAVAILABLE
              message: APIA is not responding. Try again in a few minutes.
    InternalError:
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL
              message: Something went wrong. Try again.

  schemas:
    # ---------- primitives ----------
    Cui:
      type: string
      pattern: '^(RO)?[0-9]{2,10}$'
    RunId:
      type: string
      pattern: '^run_[0-9a-z]{12}$'
    ModuleId:
      type: string
      enum: [irigatii, energie, utilaje, zootehnie, post_recolta, ecologic]
    DemoScenario:
      type: string
      enum: [irigatii, energie, utilaje, zootehnie, post_recolta, ecologic]
    RunState:
      $ref: './schemas/event.json#/$defs/runState'
    RunMode:
      type: string
      description: LIVE = real Bedrock; HYBRID = live with fallback to cache/golden; REPLAY = recorded run, figures recalculated live.
      enum: [LIVE, HYBRID, REPLAY]
    Month:
      type: string
      enum: [JAN, FEB, MAR, APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV, DEC]
    DocType:
      $ref: './schemas/submit_offer_extraction.json#/$defs/docType'
    CalcResult:
      $ref: './schemas/event.json#/$defs/calcResult'
    RunEvent:
      $ref: './schemas/event.json'

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable code, in English, for the frontend.
              enum: [VALIDATION_ERROR, NOT_FOUND, INVALID_STATE, FILE_TOO_LARGE, UNSUPPORTED_FILE_TYPE, MODULE_NOT_READY, UPSTREAM_UNAVAILABLE, BEDROCK_UNAVAILABLE, INTERNAL]
            message:
              type: string
              description: Message in English, ready to display.
              maxLength: 300
            details:
              type: array
              maxItems: 20
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
                    maxLength: 200

    # ---------- modules ----------
    ModuleList:
      type: array
      items:
        $ref: '#/components/schemas/Module'
    Module:
      type: object
      additionalProperties: false
      required: [moduleId, nameRo, icon, status, descriptionRo, examplesRo, indicator, threshold, requiredDocs, questionnaire]
      properties:
        moduleId:
          $ref: '#/components/schemas/ModuleId'
        nameRo:
          type: string
          maxLength: 60
        icon:
          type: string
          maxLength: 8
        status:
          type: string
          description: DEMO_READY = config + catalog + full calculator; CONFIG_ONLY = card and config, generic calculator.
          enum: [DEMO_READY, CONFIG_ONLY]
        descriptionRo:
          type: string
          maxLength: 200
        examplesRo:
          type: array
          items:
            type: string
            maxLength: 60
        indicator:
          $ref: './schemas/submit_technical_assessment.json#/$defs/indicator'
        threshold:
          type: object
          additionalProperties: false
          required: [kind, value, unit, sourceRo, demo]
          properties:
            kind:
              type: string
              enum: [MIN_PCT, BY_NATURE, CERTIFICATION]
            value:
              type: [number, 'null']
            unit:
              type: [string, 'null']
              enum: [PCT, HA, null]
            sourceRo:
              type: string
              maxLength: 240
            demo:
              type: boolean
              description: true = proposed threshold, to be confirmed with Raiffeisen.
        requiredDocs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [docType, labelRo, required]
            properties:
              docType:
                $ref: '#/components/schemas/DocType'
              labelRo:
                type: string
                maxLength: 160
              required:
                type: boolean
        questionnaire:
          type: array
          maxItems: 15
          items:
            $ref: '#/components/schemas/Question'
    Question:
      type: object
      additionalProperties: false
      required: [questionId, labelRo, type, prefillFrom, required]
      properties:
        questionId:
          type: string
          pattern: '^[a-z][a-z0-9_]{2,40}$'
        labelRo:
          type: string
          maxLength: 200
        type:
          type: string
          enum: [TEXT, NUMBER, BOOLEAN, SINGLE_CHOICE, MULTI_CHOICE, MONTHS]
        unit:
          type: string
          enum: [KG_N_PER_HA, T_PER_HA, HA, HOURS, EUR, M]
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [value, labelRo]
            properties:
              value:
                type: string
                pattern: '^[A-Z][A-Z0-9_]{1,40}$'
              labelRo:
                type: string
                maxLength: 80
        prefillFrom:
          type: string
          enum: [APIA, ANAF, OPEN_BANKING, NONE]
        required:
          type: boolean

    # ---------- farm ----------
    FarmProfile:
      type: object
      additionalProperties: false
      required: [cui, company, farm, parcels, cashflow, dataSources]
      properties:
        cui:
          $ref: '#/components/schemas/Cui'
        company:
          $ref: '#/components/schemas/Company'
        farm:
          $ref: '#/components/schemas/Farm'
        parcels:
          $ref: '#/components/schemas/ParcelCollection'
        cashflow:
          $ref: '#/components/schemas/CashflowSummary'
        dataSources:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceStatus'
    Company:
      type: object
      additionalProperties: false
      required: [cui, name, legalForm, caen, caenLabelRo, county, registeredAt, employees, turnoverEur, totalAssetsEur, financialYear, vatPayer, smeStatus]
      properties:
        cui:
          $ref: '#/components/schemas/Cui'
        name:
          type: string
          maxLength: 160
        legalForm:
          type: string
          enum: [SRL, SA, PFA, II, IF, COOPERATIVA]
        caen:
          type: string
          pattern: '^[0-9]{4}$'
        caenLabelRo:
          type: string
          maxLength: 200
        county:
          type: string
          maxLength: 40
        locality:
          type: string
          maxLength: 80
        registeredAt:
          type: string
          format: date
        employees:
          type: integer
          minimum: 0
        turnoverEur:
          type: [number, 'null']
          description: null when the company has not filed a balance sheet in the last two years.
        netProfitEur:
          type: [number, 'null']
        totalAssetsEur:
          type: [number, 'null']
          description: Fixed assets + current assets + prepaid expenses, from the latest balance sheet; null without a balance sheet.
        financialYear:
          type: integer
        vatPayer:
          type: boolean
        smeStatus:
          type: string
          enum: [SME, NOT_SME, UNKNOWN]
          description: SME = fewer than 250 employees and (turnover ≤ EUR 50 million or total assets ≤ EUR 43 million), Recommendation 2003/361/EC. UNKNOWN when the balance sheet does not give the figures.
        manager:
          type: [object, 'null']
          additionalProperties: false
          description: Only what is needed for eligibility (DR-12); no name or CNP (personal ID). null for companies looked up at ANAF, where the data sits with ONRC.
          required: [age, installedAt]
          properties:
            age:
              type: integer
              minimum: 18
              maximum: 100
            installedAt:
              type: string
              format: date
    Farm:
      type: object
      additionalProperties: false
      required: [totalHa, standardOutputEur, irrigatedNow, crops, livestock]
      properties:
        totalHa:
          type: number
        standardOutputEur:
          type: number
          description: Standard output (SO), for AFIR eligibility.
        irrigatedNow:
          type: boolean
        currentIrrigation:
          type: string
          enum: [NU, ASPERSIE_VECHE, ASPERSIE, PICURARE, BRAZDE]
        crops:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [year, crop, ha]
            properties:
              year:
                type: integer
              crop:
                type: string
                maxLength: 60
              ha:
                type: number
              yieldTPerHa:
                type: number
        livestock:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [species, heads]
            properties:
              species:
                type: string
                enum: [BOVINE, OVINE, CAPRINE, PORCINE, PASARI]
              heads:
                type: integer
                minimum: 0
        apiaSubsidiesEur:
          type: number
    ParcelCollection:
      type: object
      description: GeoJSON FeatureCollection (RFC 7946), WGS84 coordinates [lon, lat].
      additionalProperties: false
      required: [type, features]
      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/ParcelFeature'
    ParcelFeature:
      type: object
      additionalProperties: false
      required: [type, id, geometry, properties]
      properties:
        type:
          const: Feature
        id:
          type: string
          pattern: '^[a-z]{2}_[0-9a-z_]{2,20}$'
        geometry:
          type: object
          additionalProperties: false
          required: [type, coordinates]
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon]
            coordinates:
              type: array
              minItems: 1
              items:
                type: array
        properties:
          type: object
          additionalProperties: false
          required: [parcelId, blockId, areaHa, crop, natura2000, nitrateVulnerable, droughtRisk, hailRisk, floodRisk, waterStress]
          properties:
            parcelId:
              type: string
            blockId:
              type: string
              description: The APIA physical block.
            areaHa:
              type: number
            crop:
              type: string
              maxLength: 60
            natura2000:
              type: boolean
            nitrateVulnerable:
              type: boolean
            droughtRisk:
              $ref: '#/components/schemas/RiskLevel'
            hailRisk:
              $ref: '#/components/schemas/RiskLevel'
            floodRisk:
              $ref: '#/components/schemas/RiskLevel'
            waterStress:
              $ref: '#/components/schemas/RiskLevel'
            et0SeasonMm:
              type: number
              description: Reference evapotranspiration ET₀ over the irrigation season, in mm (climate data; mocked in the demo).
            effectiveRainSeasonMm:
              type: number
              description: Effective rainfall over the irrigation season, in mm (climate data; mocked in the demo).
    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    CashflowSummary:
      type: object
      additionalProperties: false
      required: [months, annualNetEur, avgMonthlyNetEur, peakMonths, source, mode]
      properties:
        months:
          type: array
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required: [month, inflowEur, outflowEur, netEur]
            properties:
              month:
                type: string
                pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
              inflowEur:
                type: number
              outflowEur:
                type: number
              netEur:
                type: number
        annualNetEur:
          type: number
        avgMonthlyNetEur:
          type: number
        peakMonths:
          type: array
          items:
            $ref: '#/components/schemas/Month'
        source:
          const: OPEN_BANKING
        mode:
          $ref: '#/components/schemas/SourceMode'
    DataSourceStatus:
      type: object
      additionalProperties: false
      required: [source, mode, fetchedAt]
      properties:
        source:
          type: string
          enum: [ANAF, APIA, ANSVSA, OPEN_BANKING, COPERNICUS, NATURA_2000, NITRATES]
        mode:
          $ref: '#/components/schemas/SourceMode'
        fetchedAt:
          type: string
          format: date-time
    SourceMode:
      type: string
      enum: [LIVE, MOCK, CACHE]

    # ---------- runs ----------
    CreateRunForm:
      type: object
      additionalProperties: false
      required: [cui, moduleId, parcelIds, questionnaire, documentManifest, documents]
      properties:
        cui:
          $ref: '#/components/schemas/Cui'
        moduleId:
          $ref: '#/components/schemas/ModuleId'
        parcelIds:
          type: array
          minItems: 1
          items:
            type: string
        questionnaire:
          $ref: '#/components/schemas/QuestionnaireAnswers'
        documentManifest:
          type: array
          description: One element per file in `documents`, in the same order.
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [fileName, docType]
            properties:
              fileName:
                type: string
                maxLength: 200
              docType:
                $ref: '#/components/schemas/DocType'
        documents:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            contentMediaType: application/octet-stream
        consents:
          type: object
          additionalProperties: false
          properties:
            apia:
              type: boolean
            openBanking:
              type: boolean
    QuestionnaireAnswers:
      type: object
      description: The answers, key = `questionId` from `GET /api/modules`.
      propertyNames:
        pattern: '^[a-z][a-z0-9_]{2,40}$'
      additionalProperties:
        type: [string, number, boolean, array]
        items:
          type: string
    RunCreated:
      type: object
      additionalProperties: false
      required: [runId, state, runUrl, eventsUrl]
      properties:
        runId:
          $ref: '#/components/schemas/RunId'
        state:
          $ref: '#/components/schemas/RunState'
        runUrl:
          type: string
        eventsUrl:
          type: string
    RunView:
      type: object
      additionalProperties: false
      required: [runId, cui, moduleId, scenario, state, mode, monitoring, createdAt, updatedAt, lastEventSeq, farm, parcelIds, documents, questionnaire, agentStatus, agents, calcs, submission, officerActions, pendingDocuments, error]
      properties:
        runId:
          $ref: '#/components/schemas/RunId'
        cui:
          $ref: '#/components/schemas/Cui'
        moduleId:
          $ref: '#/components/schemas/ModuleId'
        scenario:
          description: The demo scenario, if the dossier was created with `POST /api/runs/demo/{scenario}`.
          anyOf:
            - $ref: '#/components/schemas/DemoScenario'
            - type: 'null'
        state:
          $ref: '#/components/schemas/RunState'
        mode:
          $ref: '#/components/schemas/RunMode'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastEventSeq:
          type: integer
          minimum: 0
          description: The last `seq` emitted; the frontend can subscribe to SSE with `after=lastEventSeq`.
        farm:
          $ref: '#/components/schemas/FarmProfile'
        parcelIds:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/RunDocument'
        questionnaire:
          $ref: '#/components/schemas/QuestionnaireAnswers'
        agentStatus:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentStatus'
        agents:
          type: object
          additionalProperties: false
          required: [extractions, technicalAssessment, fundingRecommendation, underwritingReport]
          properties:
            extractions:
              type: array
              items:
                $ref: './schemas/submit_offer_extraction.json'
            technicalAssessment:
              anyOf:
                - $ref: './schemas/submit_technical_assessment.json'
                - type: 'null'
            fundingRecommendation:
              description: With `view=sme`, `SmeFundingRecommendation`.
              anyOf:
                - $ref: './schemas/submit_funding_recommendation.json'
                - $ref: '#/components/schemas/SmeFundingRecommendation'
                - type: 'null'
            underwritingReport:
              description: With `view=sme`, `SmeUnderwritingReport`.
              anyOf:
                - $ref: './schemas/submit_underwriting_report.json'
                - $ref: '#/components/schemas/SmeUnderwritingReport'
                - type: 'null'
        calcs:
          type: object
          description: All figures of the dossier, key = calcId. Resolves any `*CalcId` in the agent outputs.
          propertyNames:
            pattern: '^calc_[a-f0-9]{12}$'
          additionalProperties:
            $ref: '#/components/schemas/CalcResult'
        monitoring:
          description: The result of "Simulate 12 months"; `null` until then.
          anyOf:
            - $ref: '#/components/schemas/MonitoringResult'
            - type: 'null'
        submission:
          description: The variant submitted to the bank; `null` until `POST /api/runs/{id}/submit`.
          anyOf:
            - $ref: '#/components/schemas/Submission'
            - type: 'null'
        officerActions:
          type: array
          items:
            $ref: '#/components/schemas/OfficerAction'
        pendingDocuments:
          type: array
          items:
            $ref: '#/components/schemas/PendingDocument'
        error:
          description: Only in state ESUAT.
          anyOf:
            - $ref: '#/components/schemas/RunError'
            - type: 'null'
    RunDocument:
      type: object
      additionalProperties: false
      required: [documentId, docType, fileName, sizeBytes]
      properties:
        documentId:
          type: string
          pattern: '^doc_[a-z0-9_]{3,40}$'
        docType:
          $ref: '#/components/schemas/DocType'
        fileName:
          type: string
          maxLength: 200
        sizeBytes:
          type: integer
          minimum: 0
    AgentStatus:
      type: object
      additionalProperties: false
      required: [agent, status]
      properties:
        agent:
          $ref: './schemas/event.json#/$defs/agent'
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, DEGRADED, FAILED]
        source:
          $ref: './schemas/event.json#/$defs/source'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    OfficerAction:
      type: object
      additionalProperties: false
      required: [action, at, officerId]
      properties:
        action:
          type: string
          enum: [APPROVE, REQUEST_DOCUMENTS]
        at:
          type: string
          format: date-time
        officerId:
          type: string
          maxLength: 60
        commentRo:
          type: string
          maxLength: 1000
    PendingDocument:
      type: object
      additionalProperties: false
      required: [docType, labelRo, requestedAt]
      properties:
        docType:
          $ref: '#/components/schemas/DocType'
        labelRo:
          type: string
          maxLength: 200
        conditionId:
          type: string
          pattern: '^cp_[a-z0-9_]{2,40}$'
        dueDate:
          type: string
          format: date
        requestedAt:
          type: string
          format: date-time
    Variant:
      type: string
      description: |
        The SME's two cards (README §7). `CLASIC` = the `STANDARD` option; `VERDE` = the recommended green option
        (`GREEN_PACKAGE` or `GREEN_PACKAGE_WITH_GRANT`), or the only green option, with `greenEligible: true`.
      enum: [CLASIC, VERDE]
    SubmitRequest:
      type: object
      additionalProperties: false
      required: [variant]
      properties:
        variant:
          $ref: '#/components/schemas/Variant'
    Submission:
      type: object
      additionalProperties: false
      required: [variant, optionId, submittedAt]
      properties:
        variant:
          $ref: '#/components/schemas/Variant'
        optionId:
          description: The option in `agents.fundingRecommendation.options` that matches the variant.
          $ref: './schemas/submit_funding_recommendation.json#/$defs/optionId'
        submittedAt:
          type: string
          format: date-time
    SmeFundingRecommendation:
      type: object
      additionalProperties: false
      description: '`submit_funding_recommendation` without `officerNotesRo`, the notes for the bank (only in `view=sme`).'
      required: [options, recommendedOptionId, recommendationBasis, greenTier, programChecks, grantOutlook, comparison, farmerExplanationRo]
      properties:
        options:
          $ref: './schemas/submit_funding_recommendation.json#/properties/options'
        recommendedOptionId:
          $ref: './schemas/submit_funding_recommendation.json#/properties/recommendedOptionId'
        recommendationBasis:
          $ref: './schemas/submit_funding_recommendation.json#/properties/recommendationBasis'
        greenTier:
          $ref: './schemas/submit_funding_recommendation.json#/properties/greenTier'
        programChecks:
          $ref: './schemas/submit_funding_recommendation.json#/properties/programChecks'
        grantOutlook:
          $ref: './schemas/submit_funding_recommendation.json#/properties/grantOutlook'
        comparison:
          $ref: './schemas/submit_funding_recommendation.json#/properties/comparison'
        farmerExplanationRo:
          $ref: './schemas/submit_funding_recommendation.json#/properties/farmerExplanationRo'
    SmeUnderwritingReport:
      type: object
      additionalProperties: false
      description: |
        The part of `submit_underwriting_report` that the SME sees (only in `view=sme`): the decision, the criterion, the impact,
        the conditions precedent to drawdown, the monitoring indicators and the next steps. The fund and its requirements, the
        green bond framework category, the labels, DNSH, the risks and the committee summary stay with the bank.
      required: [decision, moduleId, recommendedOptionId, criterion, impact, conditionsPrecedent, monitoringKpis, farmerNextSteps]
      properties:
        decision:
          $ref: './schemas/submit_underwriting_report.json#/properties/decision'
        moduleId:
          $ref: './schemas/submit_underwriting_report.json#/properties/moduleId'
        recommendedOptionId:
          $ref: './schemas/submit_underwriting_report.json#/properties/recommendedOptionId'
        criterion:
          $ref: './schemas/submit_underwriting_report.json#/properties/criterion'
        impact:
          $ref: './schemas/submit_underwriting_report.json#/properties/impact'
        conditionsPrecedent:
          $ref: './schemas/submit_underwriting_report.json#/properties/conditionsPrecedent'
        monitoringKpis:
          $ref: './schemas/submit_underwriting_report.json#/properties/monitoringKpis'
        farmerNextSteps:
          $ref: './schemas/submit_underwriting_report.json#/properties/farmerNextSteps'
    RunError:
      type: object
      additionalProperties: false
      required: [code, message, failedStep]
      properties:
        code:
          $ref: './schemas/event.json#/$defs/runFailedData/properties/errorCode'
        message:
          type: string
          maxLength: 300
        failedStep:
          type: string
          enum: [DATE_FIRMA, AGENT_1, AGENT_2, AGENT_3]

    # ---------- officer ----------
    ApproveRequest:
      type: object
      additionalProperties: false
      required: [officerId]
      properties:
        officerId:
          type: string
          maxLength: 60
        commentRo:
          type: string
          maxLength: 1000
        acceptedConditionIds:
          type: array
          description: The conditions from the report that the officer keeps. Absent = all.
          items:
            type: string
            pattern: '^cp_[a-z0-9_]{2,40}$'
    RequestDocumentsRequest:
      type: object
      additionalProperties: false
      required: [officerId, documents]
      properties:
        officerId:
          type: string
          maxLength: 60
        messageRo:
          type: string
          maxLength: 1000
          description: The message shown to the farmer.
        documents:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [docType, labelRo]
            properties:
              docType:
                $ref: '#/components/schemas/DocType'
              labelRo:
                type: string
                maxLength: 200
              conditionId:
                type: string
                pattern: '^cp_[a-z0-9_]{2,40}$'
              dueDate:
                type: string
                format: date

    MonitoringResult:
      type: object
      additionalProperties: false
      description: Actual impact against the estimate, 12 months after drawdown (simulated in the demo). The figures are in `RunView.calcs`.
      required: [months, simulated, metrics, confirmed, impactBonusApplied, rateBeforeCalcId, rateAfterCalcId, bonusPpCalcId]
      properties:
        months:
          type: integer
          const: 12
        simulated:
          type: boolean
        metrics:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [metric, estimatedCalcId, actualCalcId, deviationPctCalcId, withinTolerance]
            properties:
              metric:
                type: string
                maxLength: 40
              estimatedCalcId:
                type: string
                pattern: '^calc_[a-f0-9]{12}$'
              actualCalcId:
                type: string
                pattern: '^calc_[a-f0-9]{12}$'
              deviationPctCalcId:
                type: string
                pattern: '^calc_[a-f0-9]{12}$'
              withinTolerance:
                type: boolean
        confirmed:
          type: boolean
          description: The actual impact confirms the estimate (all metrics within the tolerance in config).
        impactBonusApplied:
          type: boolean
          description: The impact bonus (a product proposal, not an existing Raiffeisen product) is applied only if `confirmed`.
        rateBeforeCalcId:
          type: string
          pattern: '^calc_[a-f0-9]{12}$'
        rateAfterCalcId:
          type: string
          pattern: '^calc_[a-f0-9]{12}$'
        bonusPpCalcId:
          type: string
          pattern: '^calc_[a-f0-9]{12}$'
    Portfolio:
      type: object
      additionalProperties: false
      description: Totals calculated by the engine from the approved dossiers. Amounts are in EUR.
      required: [generatedAt, loanCount, totalAmountEur, byModule, byFund, byTier, impact, monitoring, parametersDemo]
      properties:
        generatedAt:
          type: string
          format: date-time
        loanCount:
          type: integer
          minimum: 0
        totalAmountEur:
          type: number
          minimum: 0
        byModule:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [moduleId, count, amountEur]
            properties:
              moduleId:
                $ref: '#/components/schemas/ModuleId'
              count:
                type: integer
                minimum: 0
              amountEur:
                type: number
                minimum: 0
        byFund:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fundCode, nameRo, count, amountEur]
            properties:
              fundCode:
                type: string
                enum: [F1, F2, F3, F4, F5, F6]
              nameRo:
                type: string
                maxLength: 120
              count:
                type: integer
                minimum: 0
              amountEur:
                type: number
                minimum: 0
        byTier:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tier, count]
            properties:
              tier:
                type: string
                enum: [VERDE_PLUS, VERDE, VERDE_CU_UPGRADE, CLASIC]
              count:
                type: integer
                minimum: 0
        impact:
          type: object
          additionalProperties: false
          required: [co2AvoidedT, energyMwh, waterM3, fuelL, nitrogenKg, certifiedAreaHa]
          properties:
            co2AvoidedT:
              type: number
            energyMwh:
              type: number
            waterM3:
              type: number
            fuelL:
              type: number
            nitrogenKg:
              type: number
            certifiedAreaHa:
              type: number
        monitoring:
          type: object
          additionalProperties: false
          required: [monitoredCount, confirmedCount]
          properties:
            monitoredCount:
              type: integer
              minimum: 0
            confirmedCount:
              type: integer
              minimum: 0
        parametersDemo:
          type: boolean
          description: true while the parameters in `config/` are marked `demo`; the officer area shows them as "demo parameters".

    # ---------- health ----------
    BedrockHealth:
      type: object
      additionalProperties: false
      required: [status, region, mode, checkedAt, models, goldenRunsAvailable]
      properties:
        status:
          type: string
          description: UP = all models respond; DEGRADED = works with retry or a backup model; DOWN = REPLAY only.
          enum: [UP, DEGRADED, DOWN]
        region:
          type: string
          maxLength: 30
        mode:
          $ref: '#/components/schemas/RunMode'
        checkedAt:
          type: string
          format: date-time
        models:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, modelId, status]
            properties:
              role:
                type: string
                enum: [AGENT, EXTRACTION, FALLBACK]
              modelId:
                type: string
                maxLength: 120
              status:
                type: string
                enum: [UP, DOWN]
              latencyMs:
                type: integer
                minimum: 0
              errorRo:
                type: string
                maxLength: 300
        goldenRunsAvailable:
          type: array
          description: The demo scenarios for which a recorded run exists (fallback level 4).
          items:
            $ref: '#/components/schemas/DemoScenario'
