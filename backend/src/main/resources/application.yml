spring:
  application:
    name: greenstruct-agro
  # Local secrets and settings from the repo-root .env (git-ignored; see .env.example). Missing file = defaults.
  config:
    import: optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    generator:
      write-bigdecimal-as-plain: true

server:
  port: 8080

greenstruct:
  # Fix the analysis date for the demo so DR-12 stays "open" whatever day we present; empty = today.
  analysis-date: ${GREENSTRUCT_ANALYSIS_DATE:}
  mode: ${GREENSTRUCT_MODE:HYBRID}
  bedrock:
    region: ${GREENSTRUCT_BEDROCK_REGION:eu-central-1}
    agent-model-id: ${GREENSTRUCT_AGENT_MODEL_ID:}
    extraction-model-id: ${GREENSTRUCT_EXTRACTION_MODEL_ID:}
    # Second model for the agents when the first keeps failing; empty = the extraction model.
    fallback-model-id: ${GREENSTRUCT_FALLBACK_MODEL_ID:}
  # true = after a successful LIVE run of a demo dossier, write data/demo/golden/<scenario>/<agent>.json
  record-golden: ${GREENSTRUCT_RECORD_GOLDEN:false}
  agent-runtime:
    max-iterations: 12       # Converse calls per agent (the technical auditor needs about 10 sequential steps)
    replay-delay: 350ms      # pause between replayed events, so the timeline looks live
  # Real ANAF lookup for any CUI that is not a demo farm; false = everything from data/demo/farms (offline demo).
  anaf:
    enabled: ${GREENSTRUCT_ANAF_ENABLED:true}
    base-url: https://webservicesp.anaf.ro
    connect-timeout: 3s
    read-timeout: 8s
    min-interval: 1s
    cache-ttl: 12h
  paths:
    config: ../config
    data: ../data
    uploads: ${java.io.tmpdir}/greenstruct-agro-uploads
  agents:
    timeout: 240s            # one agent = up to 8 Converse calls plus retries
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
