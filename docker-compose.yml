services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nexxt
      POSTGRES_USER: nexxt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexxt -d nexxt"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nexxt:${POSTGRES_PASSWORD}@db:5432/nexxt
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_DATABASE_URL: postgresql://nexxt:${POSTGRES_PASSWORD}@db:5432/nexxt_demo
      NODE_ADMIN_DATABASE_URL: postgresql://nexxt:${POSTGRES_PASSWORD}@db:5432/nexxt
      DEMO_TODAY: ${DEMO_TODAY:-2026-11-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      # CSV statements are parsed by the Python API; without it, uploads are saved and marked as not read.
      PYTHON_API_URL: ${PYTHON_API_URL:-http://api:8000}
    ports:
      - "${NODE_API_BIND:-127.0.0.1}:${NODE_API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      server:
        condition: service_healthy
volumes:
  postgres_data:
