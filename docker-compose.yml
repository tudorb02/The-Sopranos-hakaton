services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nexxt
      POSTGRES_USER: nexxt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexxt -d nexxt"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nexxt:${POSTGRES_PASSWORD}@db:5432/nexxt
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
